# .github/workflows/build.yml
# Dependency source: pyproject.toml (core + [dev] for tests). AI backend
# extras (ast/birdnet/perch) and the photo extra are intentionally NOT
# installed here — they require real models/large runtimes and are not
# needed to run the test suite or build the executable (AI imports are
# lazy in production code). Real AI runtime checks belong in a separate,
# explicit, manually-triggered workflow — not yet added.
name: Build TimbrosaField Cross-Platform

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Handmatig triggeren via GitHub UI

jobs:
  test:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install core + development/test dependencies
      run: |
        pip install --upgrade pip
        pip install ".[dev]"

    - name: Run test suite
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python3 -m pytest -q

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install .
        pip install pyinstaller

    - name: Build macOS app
      run: |
        cd src/my_app
        pyinstaller --onefile --windowed --name="TimbrosaField" --paths=.. main.py

    - name: Create DMG (optional)
      run: |
        cd src/my_app/dist
        mkdir -p dmg_temp
        cp TimbrosaField dmg_temp/
        hdiutil create -format UDZO -srcfolder dmg_temp TimbrosaField-macOS.dmg

    - name: Upload macOS executable
      uses: actions/upload-artifact@v4
      with:
        name: TimbrosaField-macOS
        path: src/my_app/dist/TimbrosaField

    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: TimbrosaField-macOS-DMG
        path: src/my_app/dist/TimbrosaField-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install .
        pip install pyinstaller

    - name: Build Windows app
      run: |
        cd src/my_app
        pyinstaller --onefile --windowed --name="TimbrosaField" --paths=.. main.py

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: TimbrosaField-Windows
        path: src/my_app/dist/TimbrosaField.exe

  create-release:
    needs: [test, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          TimbrosaField-macOS/TimbrosaField
          TimbrosaField-macOS-DMG/TimbrosaField-macOS.dmg
          TimbrosaField-Windows/TimbrosaField.exe
        generate_release_notes: true
        draft: false
        body: |
          ## TimbrosaField Release
          
          🎵 **Field Recording Analysis & Tagging Tool**
          
          ### Downloads:
          - **macOS**: Download `TimbrosaField` executable or `TimbrosaField-macOS.dmg`
          - **Windows**: Download `TimbrosaField.exe`
          
          ### Features:
          - Advanced waveform visualization
          - Metadata management & tagging
          - Ableton Live export
          - Professional audio analysis
          
          Happy field recording! 🎧